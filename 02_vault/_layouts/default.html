<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — {{ site.title }}</title>
<style>body{max-width:900px;margin:40px auto;padding:0 20px;font:16px/1.6 system-ui,sans-serif;color:#222}a{color:#2457a6}pre{overflow:auto;padding:1em;background:#f4f4f4}code{background:#f4f4f4;padding:.1em .25em}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:.4em .7em}.date{color:#666;font-size:.9em}</style>
</head>
<body>{% if page.date %}<p class="date">{{ page.date | date: "%d.%m.%Y %H:%M" }}</p>{% endif %}{{ content }}</body>
</html>
